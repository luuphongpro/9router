[package]
name = "ninerouter-sse"
version = "0.1.0"
edition = "2021"

[dependencies]
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "io-util", "rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
memchr = "2"
anyhow = "1.0"
pin-project-lite = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
